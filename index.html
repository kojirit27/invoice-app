<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1e3a8a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Generator Invoice Canvas - Bordirankoe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding:
                env(safe-area-inset-top)
                env(safe-area-inset-right)
                env(safe-area-inset-bottom)
                env(safe-area-inset-left);

            font-family:
                'Inter',
                -apple-system,
                BlinkMacSystemFont,
                'Segoe UI',
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;

            text-rendering: optimizeLegibility;

            overflow-x: hidden;
        }

        button,
        input,
        textarea,
        select {
            font-size: 16px;
        }

        canvas {
            max-width: 100%;
            width: 100%;
            height: auto;
            display: block;
        }

        .word-break {
            word-break: break-word;
            overflow-wrap: break-word;
        }

        @media print {
            body {
                background: white !important;
            }

            canvas {
                width: 100% !important;
                height: auto !important;
            }
        }
        body { font-family: 'Inter', sans-serif; }
        
        /* Custom scrollbar for the editor panel */
        .custom-scrollbar {
            -webkit-overflow-scrolling: touch;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

    <div class="max-w-[1400px] mx-auto p-4 md:p-6 flex flex-col lg:flex-row gap-6 min-h-screen overflow-hidden">
        
        <!-- ==================== -->
        <!-- LEFT PANEL: EDITOR -->
        <!-- ==================== -->
        <div class="w-full lg:w-1/3 bg-white rounded-xl shadow-md border border-gray-200 flex flex-col min-h-[500px] max-h-[80vh] lg:h-[calc(100vh-3rem)]">
            <div class="p-4 border-b border-gray-200 bg-gray-50 rounded-t-xl flex justify-between items-center">
                <h2 class="text-lg font-bold text-gray-800">Edit Data Invoice</h2>
                <button onclick="saveData()" id="saveBtn" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-1.5 px-3 rounded text-xs shadow transition duration-200">
                    Simpan Data NYA AAA
                </button>
            </div>
            
            <div class="p-4 overflow-y-auto custom-scrollbar flex-1 flex flex-col gap-6" id="editorForm">
                
                <!-- General Info -->
                <div class="space-y-3">
                    <h3 class="text-sm font-semibold text-blue-800 uppercase tracking-wider border-b pb-1">Informasi Umum</h3>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Nomor Invoice</label>
                            <input type="text" id="invNum" class="w-full text-sm p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" oninput="updateInvoice()">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Tanggal</label>
                            <input type="text" id="invDate" class="w-full text-sm p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" oninput="updateInvoice()">
                        </div>
                    </div>
                </div>

                <!-- Seller Info -->
                <div class="space-y-3">
                    <h3 class="text-sm font-semibold text-blue-800 uppercase tracking-wider border-b pb-1">Detail Penjual</h3>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Nama Toko (Teks)</label>
                            <input type="text" id="sellerName" class="w-full text-sm p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" oninput="updateInvoice()">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Upload Logo Toko</label>
                            <input type="file" id="logoUpload" accept="image/*" class="w-full text-sm p-1 border rounded focus:ring-2 focus:ring-blue-500 outline-none cursor-pointer">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="col-span-2">
                            <label class="block text-xs font-medium text-gray-600 mb-1">Alamat Baris 1</label>
                            <input type="text" id="sellerAddr1" class="w-full text-sm p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" oninput="updateInvoice()">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Alamat Baris 2</label>
                            <input type="text" id="sellerAddr2" class="w-full text-sm p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" oninput="updateInvoice()">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Telepon</label>
                            <input type="text" id="sellerPhone" class="w-full text-sm p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" oninput="updateInvoice()">
                        </div>
                    </div>
                </div>

                <!-- Buyer Info -->
                <div class="space-y-3">
                    <h3 class="text-sm font-semibold text-blue-800 uppercase tracking-wider border-b pb-1">Detail Pembeli (To)</h3>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Nama Pembeli</label>
                        <input type="text" id="toName" class="w-full text-sm p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" oninput="updateInvoice()">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Alamat Lengkap</label>
                        <input type="text" id="toAddr" class="w-full text-sm p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" oninput="updateInvoice()">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Telepon</label>
                        <input type="text" id="toPhone" class="w-full text-sm p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" oninput="updateInvoice()">
                    </div>
                </div>

                <!-- Items -->
                <div class="space-y-3">
                    <h3 class="text-sm font-semibold text-blue-800 uppercase tracking-wider border-b pb-1">Daftar Barang</h3>
                    <div id="itemsContainer" class="flex flex-col gap-2">
                        <!-- Item rows will be generated by JS -->
                    </div>
                </div>

                <!-- Totals & Notes -->
                <div class="space-y-3">
                    <h3 class="text-sm font-semibold text-blue-800 uppercase tracking-wider border-b pb-1">Diskon, Ongkir & Catatan</h3>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Diskon (%)</label>
                            <input type="number" id="discountPct" class="w-full text-sm p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" oninput="updateInvoice()" min="0" max="100">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Ongkos Kirim (Rp)</label>
                            <input type="number" id="shippingFee" class="w-full text-sm p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" oninput="updateInvoice()" min="0">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Catatan 1</label>
                        <input type="text" id="note1" class="w-full text-sm p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" oninput="updateInvoice()">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Catatan 2</label>
                        <input type="text" id="note2" class="w-full text-sm p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" oninput="updateInvoice()">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Rekening Bank (Pisahkan dg baris baru)</label>
                        <textarea id="bankAccounts" rows="5" class="w-full text-sm p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" oninput="updateInvoice()"></textarea>
                    </div>
                </div>
                
            </div>
        </div>

        <!-- ==================== -->
        <!-- RIGHT PANEL: PREVIEW -->
        <!-- ==================== -->
        <div class="w-full lg:w-2/3 flex flex-col gap-4">
            
            <!-- Header Controls -->
            <div class="w-full bg-white p-4 md:p-6 rounded-xl shadow-sm border border-gray-200 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">Preview Invoice</h1>
                    <p class="text-sm text-gray-500">Perubahan di sebelah kiri otomatis tampil di sini.</p>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                    <button onclick="printInvoice()" class="bg-gray-600 hover:bg-gray-700 text-white font-semibold py-2 px-4 rounded-lg shadow transition duration-200 flex items-center gap-2 text-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M5 4v3H4a2 2 0 00-2 2v3a2 2 0 002 2h1v2a2 2 0 002 2h6a2 2 0 002-2v-2h1a2 2 0 002-2V9a2 2 0 00-2-2h-1V4a2 2 0 00-2-2H7a2 2 0 00-2 2zm8 0H7v3h6V4zm0 8H7v4h6v-4z" clip-rule="evenodd" />
                        </svg>
                        Print
                    </button>
                    <button onclick="downloadPDF()" class="bg-red-700 hover:bg-red-800 text-white font-semibold py-2 px-4 rounded-lg shadow transition duration-200 flex items-center gap-2 text-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 6a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z" clip-rule="evenodd" />
                        </svg>
                        PDF
                    </button>
                    <button onclick="saveCanvasAsImage()" class="bg-blue-800 hover:bg-blue-900 text-white font-semibold py-2 px-4 rounded-lg shadow transition duration-200 flex items-center gap-2 text-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" />
                        </svg>
                        PNG
                    </button>
                </div>
            </div>

            <!-- Canvas Container -->
            <div class="w-full overflow-y-auto overflow-x-hidden flex-1 flex justify-center bg-gray-200 p-4 rounded-xl border border-gray-300 shadow-inner min-h-[500px] max-h-[80vh] lg:h-auto custom-scrollbar">
                <canvas id="invoiceCanvas"></canvas>
            </div>
        </div>
    </div>

    <script>

        
        

       
        // Data Awal
        let invoiceData = {
            invoiceNumber: "A-10200044",
            toName: "Ibu Niken",
            toAddress: "Jl Taman Bukit Hijau III No 39 Pondok Indah Jaksel 123",
            toPhone: "0811 8855 590",
            date: "20 May 2026",
            sellerName: "Bordirankoe",
            sellerAddress1: "Jl. Mas Ganden no.9 Cilandak I",
            sellerAddress2: "Jakarta Selatan",
            sellerPhone: "0819 1046 1070",
            items: [
                { description: "Elora Pants Cream", qty: 1, unitPrice: 795000 },
                { description: "", qty: null, unitPrice: null },
                { description: "", qty: null, unitPrice: null },
                { description: "", qty: null, unitPrice: null },
                { description: "", qty: null, unitPrice: null },
                { description: "", qty: null, unitPrice: null },
                { description: "", qty: null, unitPrice: null },
                { description: "", qty: null, unitPrice: null },
                { description: "", qty: null, unitPrice: null },
                { description: "", qty: null, unitPrice: null },
            ],
            note1: "Barang dikirim ke alamat Jl H Nawi Buntu 5 Kel Gandari",
            note2: "Utara Jakarta Selatan",
            discountPercent: 20,
            shippingFee: 0,
            bankAccounts: [
                "a/n Dian Siska Novita",
                "Bank Mandiri: 1260009853515",
                "CIMB Niaga: 764222156700",
                "BCA: 622-060-9853",
                "BNI: 1979335641"
            ]
        };

        const canvas = document.getElementById('invoiceCanvas');
        
        const ctx = canvas.getContext('2d');

        // ==========================================
        // LOGO PERMANEN (PATEN)
        // Jika Anda ingin logo selalu ada tanpa harus di-upload setiap buka file,
        // ubah gambar logo Anda menjadi teks Base64 (gunakan web image to base64) 
        // lalu paste teks panjang tersebut di antara tanda kutip di bawah ini:
        // ==========================================
        const defaultLogoBase64 = ""; 

        let loadedLogoImg = null;

        function setupCanvasResolution() {
            // Selalu pakai resolusi A4 penuh — CSS width:100% yang handle scaling di mobile
            canvas.width = 2480;
            canvas.height = 3508;
        }

        function checkCompatibility() {
            if (!window.localStorage) {
                alert('Browser tidak mendukung localStorage');
            }

            if (!window.FileReader) {
                alert('Browser tidak mendukung upload gambar');
            }

            if (!canvas.getContext) {
                alert('Browser tidak mendukung canvas');
            }
        }

        checkCompatibility();
        // FUNGSI PENTING: Memecah teks panjang menjadi beberapa baris (Word Wrap)
        function getWrapLines(context, text, maxWidth) {
            if (!text) return [];
            const words = text.toString().split(' ');
            let lines = [];
            let currentLine = words[0];

            for (let i = 1; i < words.length; i++) {
                let word = words[i];
                let width = context.measureText(currentLine + " " + word).width;
                if (width < maxWidth) {
                    currentLine += " " + word;
                } else {
                    lines.push(currentLine);
                    currentLine = word;
                }
            }
            lines.push(currentLine);
            return lines;
        }

        // Listener untuk Upload Logo
        document.getElementById('logoUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    loadedLogoImg = new Image();
                    loadedLogoImg.crossOrigin = 'anonymous';
                    loadedLogoImg.onload = function() {
                        drawInvoice(); 
                    };
                    loadedLogoImg.src = event.target.result;
                };
                reader.readAsDataURL(file);
            } else {
                loadedLogoImg = null;
                drawInvoice(); 
            }
        });

        function initUI() {
            document.getElementById('invNum').value = invoiceData.invoiceNumber;
            document.getElementById('invDate').value = invoiceData.date;
            
            document.getElementById('sellerName').value = invoiceData.sellerName;
            document.getElementById('sellerAddr1').value = invoiceData.sellerAddress1;
            document.getElementById('sellerAddr2').value = invoiceData.sellerAddress2;
            document.getElementById('sellerPhone').value = invoiceData.sellerPhone;

            document.getElementById('toName').value = invoiceData.toName;
            document.getElementById('toAddr').value = invoiceData.toAddress;
            document.getElementById('toPhone').value = invoiceData.toPhone;

            document.getElementById('note1').value = invoiceData.note1;
            document.getElementById('note2').value = invoiceData.note2;
            
            document.getElementById('discountPct').value = invoiceData.discountPercent;
            document.getElementById('shippingFee').value = invoiceData.shippingFee;
            
            document.getElementById('bankAccounts').value = invoiceData.bankAccounts.join('\n');

            const itemsContainer = document.getElementById('itemsContainer');
            itemsContainer.innerHTML = ''; 
            
            for (let i = 0; i < 10; i++) {
                const item = invoiceData.items[i] || { description: "", qty: "", unitPrice: "" };
                
                const rowHTML = `
                    <div class="flex gap-2 items-start border p-2 rounded bg-white shadow-sm">
                        <div class="w-1/2">
                            <input type="text" id="item_desc_${i}" value="${item.description}" placeholder="Nama barang..." class="w-full text-sm p-1.5 border rounded outline-none focus:border-blue-500" oninput="updateInvoice()">
                        </div>
                        <div class="w-1/6">
                            <input type="number" id="item_qty_${i}" value="${item.qty !== null ? item.qty : ''}" placeholder="Qty" class="w-full text-sm p-1.5 border rounded outline-none focus:border-blue-500" oninput="updateInvoice()">
                        </div>
                        <div class="w-2/6">
                            <input type="number" id="item_price_${i}" value="${item.unitPrice !== null ? item.unitPrice : ''}" placeholder="Harga (Rp)" class="w-full text-sm p-1.5 border rounded outline-none focus:border-blue-500" oninput="updateInvoice()">
                        </div>
                    </div>
                `;
                itemsContainer.insertAdjacentHTML('beforeend', rowHTML);
            }
        }

        function updateInvoice() {
            invoiceData.invoiceNumber = document.getElementById('invNum').value;
            invoiceData.date = document.getElementById('invDate').value;

            invoiceData.sellerName = document.getElementById('sellerName').value;
            invoiceData.sellerAddress1 = document.getElementById('sellerAddr1').value;
            invoiceData.sellerAddress2 = document.getElementById('sellerAddr2').value;
            invoiceData.sellerPhone = document.getElementById('sellerPhone').value;

            invoiceData.toName = document.getElementById('toName').value;
            invoiceData.toAddress = document.getElementById('toAddr').value;
            invoiceData.toPhone = document.getElementById('toPhone').value;

            invoiceData.note1 = document.getElementById('note1').value;
            invoiceData.note2 = document.getElementById('note2').value;

            invoiceData.discountPercent = parseFloat(document.getElementById('discountPct').value) || 0;
            invoiceData.shippingFee = parseFloat(document.getElementById('shippingFee').value) || 0;

            const bankRaw = document.getElementById('bankAccounts').value;
            invoiceData.bankAccounts = bankRaw.split('\n').filter(line => line.trim() !== '');

            for (let i = 0; i < 10; i++) {
                const desc = document.getElementById(`item_desc_${i}`).value;
                const qtyVal = document.getElementById(`item_qty_${i}`).value;
                const priceVal = document.getElementById(`item_price_${i}`).value;

                invoiceData.items[i] = {
                    description: desc,
                    qty: qtyVal ? parseInt(qtyVal) : null,
                    unitPrice: priceVal ? parseFloat(priceVal) : null
                };
            }

            drawInvoice();
        }

        function formatRupiah(amount) {
            if (amount === null || amount === undefined || isNaN(amount)) return '';
            try {
                return new Intl.NumberFormat('id-ID').format(amount);
            } catch {
                return amount.toString();
            }
        }

        function drawInvoice() {

            if (!ctx) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const darkBlue = '#1e3a8a';
            const textDark = '#1f2937';
            const textMuted = '#6b7280';

            ctx.save();
            const scaleFactor = 3;
            ctx.scale(scaleFactor, scaleFactor); 

            const marginX = 60;
            const contentWidth = 706; 
            const rightEdge = marginX + contentWidth;
            const centerX = marginX + (contentWidth / 2); // Titik Tengah

            // ==========================================
            // 1. Header Tengah: Logo & Seller Info
            // ==========================================
            let sellerTextY = 50;

            if (loadedLogoImg) {
                const maxLogoHeight = 120; // Dikecilkan agar lebih hemat ruang di bawah
                const maxLogoWidth = 400;
                let logoW = loadedLogoImg.width;
                let logoH = loadedLogoImg.height;

                if (logoH > maxLogoHeight) {
                    logoW = logoW * (maxLogoHeight / logoH);
                    logoH = maxLogoHeight;
                }
                if (logoW > maxLogoWidth) {
                    logoH = logoH * (maxLogoWidth / logoW);
                    logoW = maxLogoWidth;
                }

                // LOGO DI TENGAH: X dihitung dari titik tengah dikurangi setengah lebar logo
                const logoX = centerX - (logoW / 2); 
                const logoY = 35; 
                ctx.drawImage(loadedLogoImg, logoX, logoY, logoW, logoH);
                
                sellerTextY = logoY + logoH + 20; 
            } else {
                ctx.textAlign = 'center';
                ctx.font = 'italic bold 36px Georgia, serif'; // Dikecilkan sedikit
                ctx.fillStyle = textDark;
                ctx.fillText(invoiceData.sellerName, centerX, 70, contentWidth);
                sellerTextY = 100;
            }

            // Alamat & Phone Toko (Tengah, tepat di bawah Logo)
            ctx.textAlign = 'center';
            ctx.font = '16px Arial, sans-serif'; // Dikecilkan sedikit
            ctx.fillStyle = textDark;
            ctx.fillText(invoiceData.sellerAddress1, centerX, sellerTextY, contentWidth);
            ctx.fillText(invoiceData.sellerAddress2, centerX, sellerTextY + 20, contentWidth); // Jarak dikurangi
            ctx.fillText(`Phone: ${invoiceData.sellerPhone}`, centerX, sellerTextY + 40, contentWidth);
            
            // Garis pembatas header
            const headerBottomY = sellerTextY + 60;
            ctx.strokeStyle = '#e5e7eb';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(marginX, headerBottomY);
            ctx.lineTo(rightEdge, headerBottomY);
            ctx.stroke();

            ctx.textAlign = 'left'; // Kembalikan ke format rata kiri

            // ==========================================
            // 2. Invoice Number
            // ==========================================
            const invoiceNumY = headerBottomY + 35;

            ctx.font = 'bold 24px Arial, sans-serif'; 
            ctx.fillStyle = darkBlue;
            ctx.fillText('Invoice Number', marginX, invoiceNumY);
            
            ctx.font = '18px Arial, sans-serif'; 
            ctx.fillStyle = textDark;
            ctx.fillText(invoiceData.invoiceNumber, marginX, invoiceNumY + 25);

            // ==========================================
            // 3. Detail Pembeli (To)
            // ==========================================
            const toStartY = invoiceNumY + 65;

            ctx.font = 'bold 22px Arial, sans-serif'; 
            ctx.fillStyle = darkBlue;
            ctx.fillText('To', marginX, toStartY);
            
            ctx.font = '18px Arial, sans-serif'; 
            ctx.fillStyle = textDark;
            ctx.fillText(invoiceData.toName, marginX, toStartY + 25);
            
            // Logic wrap text untuk Alamat Pembeli
            ctx.font = '16px Arial, sans-serif'; 
            let addressLines = getWrapLines(ctx, invoiceData.toAddress, 320); 
            
            let addrY = toStartY + 50;
            for(let line of addressLines) {
                ctx.fillText(line, marginX, addrY);
                addrY += 20; // Jarak dikurangi
            }

            ctx.fillText(`Phone: ${invoiceData.toPhone}`, marginX, addrY + 5);

            // 4. Tanggal
            const dateY = addrY + 40; 
            ctx.font = 'bold 16px Arial, sans-serif'; 
            ctx.fillStyle = textDark;
            ctx.fillText('Date', marginX, dateY);
            ctx.font = '16px Arial, sans-serif'; 
            ctx.fillText(invoiceData.date, marginX + 60, dateY);

            // 5. Tabel Item
            const tableStartY = dateY + 25;
            const colWidths = [380, 80, 120, 126]; 
            const colX = [
                marginX, 
                marginX + colWidths[0], 
                marginX + colWidths[0] + colWidths[1], 
                marginX + colWidths[0] + colWidths[1] + colWidths[2]
            ];
            let currentY = tableStartY;

            // Header Tabel
            ctx.fillStyle = '#f3f4f6'; 
            ctx.fillRect(marginX, currentY, contentWidth, 40); 

            ctx.font = 'bold 16px Arial, sans-serif'; 
            ctx.fillStyle = darkBlue;
            
            ctx.fillText('Description', colX[0] + 10, currentY + 25);
            
            ctx.textAlign = 'right';
            ctx.fillText('Qty', colX[2] - 10, currentY + 25);
            ctx.fillText('Unit price', colX[3] - 10, currentY + 25);
            ctx.fillText('Total price', rightEdge - 10, currentY + 25);
            ctx.textAlign = 'left';
            
            currentY += 40;

            ctx.strokeStyle = darkBlue;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(marginX, currentY);
            ctx.lineTo(rightEdge, currentY);
            ctx.stroke();

            // Isi Tabel
            let totalItemPrice = 0;
            ctx.lineWidth = 1;

            for (let i = 0; i < invoiceData.items.length; i++) {
                const item = invoiceData.items[i];
                
                if (!item.description || item.description.trim() === "") {
                    // Jika kosong, beri tinggi default
                    currentY += 25; 
                    ctx.strokeStyle = '#e5e7eb'; 
                    ctx.beginPath();
                    ctx.moveTo(marginX, currentY);
                    ctx.lineTo(rightEdge, currentY);
                    ctx.stroke();
                } else {
                    ctx.font = '16px Arial, sans-serif'; 
                    ctx.fillStyle = textDark;

                    // Cek apakah deskripsi butuh beberapa baris
                    let descLines = getWrapLines(ctx, item.description, colWidths[0] - 20);
                    let requiredRowHeight = Math.max(30, descLines.length * 20 + 10); 
                    
                    let textStartY = currentY + 20;

                    // Print Deskripsi Multi-baris
                    for(let j=0; j<descLines.length; j++) {
                        ctx.fillText(descLines[j], colX[0] + 10, textStartY + (j * 20)); 
                    }
                    
                    // Print Harga dan Qty
                    ctx.textAlign = 'right';
                    ctx.fillText(item.qty !== null ? item.qty : '', colX[2] - 10, textStartY);
                    ctx.fillText(item.unitPrice !== null ? formatRupiah(item.unitPrice) : '', colX[3] - 10, textStartY);
                    
                    const itemTotal = (item.qty || 0) * (item.unitPrice || 0);
                    ctx.fillText(formatRupiah(itemTotal), rightEdge - 10, textStartY);
                    
                    ctx.textAlign = 'left'; 
                    totalItemPrice += itemTotal;

                    currentY += requiredRowHeight;
                }
            }

            ctx.strokeStyle = darkBlue;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(marginX, currentY);
            ctx.lineTo(rightEdge, currentY);
            ctx.stroke();

            // 6. Total dan Catatan
            let bottomY = currentY + 30; 

            // Catatan 
            ctx.textAlign = 'left';
            ctx.font = 'bold 16px Arial, sans-serif'; 
            ctx.fillStyle = textDark;
            ctx.fillText('Note :', marginX, bottomY);
            
            ctx.font = '15px Arial, sans-serif'; 
            ctx.fillStyle = textMuted;
            
            let note1Lines = getWrapLines(ctx, invoiceData.note1, 350);
            let note2Lines = getWrapLines(ctx, invoiceData.note2, 350);
            
            let noteY = bottomY + 22;
            for(let line of note1Lines) {
                if(line) { ctx.fillText(line, marginX, noteY); noteY += 20; } 
            }
            for(let line of note2Lines) {
                if(line) { ctx.fillText(line, marginX, noteY); noteY += 20; }
            }

            // Subtotal, Diskon, Pengiriman, TOTAL (Kanan)
            const labelAlignX = rightEdge - 160; 
            ctx.fillStyle = textDark;
            let totalBlockY = bottomY; 

            // Subtotal
            ctx.textAlign = 'right';
            ctx.font = '16px Arial, sans-serif'; 
            ctx.fillText('Subtotal', labelAlignX, totalBlockY);
            ctx.font = 'bold 16px Arial, sans-serif'; 
            ctx.fillText(formatRupiah(totalItemPrice), rightEdge - 10, totalBlockY);

            // Discount
            totalBlockY += 25; 
            ctx.font = '16px Arial, sans-serif'; 
            ctx.fillText(`Discount ${invoiceData.discountPercent}%`, labelAlignX, totalBlockY);
            const discountAmount = totalItemPrice * (invoiceData.discountPercent / 100);
            ctx.font = 'bold 16px Arial, sans-serif'; 
            ctx.fillText(formatRupiah(discountAmount), rightEdge - 10, totalBlockY);

            // Shipping
            totalBlockY += 25; 
            ctx.font = '16px Arial, sans-serif'; 
            ctx.fillText('Shipping Fee', labelAlignX, totalBlockY);
            ctx.font = 'bold 16px Arial, sans-serif'; 
            ctx.fillText(formatRupiah(invoiceData.shippingFee), rightEdge - 10, totalBlockY);

            // Pemisah Total
            totalBlockY += 15; 
            ctx.strokeStyle = '#e5e7eb';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(rightEdge - 320, totalBlockY); 
            ctx.lineTo(rightEdge, totalBlockY);
            ctx.stroke();

            // TOTAL
            totalBlockY += 30; 
            ctx.font = 'bold 22px Arial, sans-serif'; 
            ctx.fillStyle = darkBlue;
            ctx.fillText('TOTAL (Rp)', labelAlignX, totalBlockY);
            
            const grandTotal = totalItemPrice - discountAmount + invoiceData.shippingFee;
            ctx.fillText(formatRupiah(grandTotal), rightEdge - 10, totalBlockY);
            ctx.textAlign = 'left'; 

            // 7. Instruksi Pembayaran 
            let payY = Math.max(noteY + 30, totalBlockY + 40); 
            
            ctx.font = 'bold 16px Arial, sans-serif'; 
            ctx.fillStyle = darkBlue;
            ctx.fillText('Payment Instruction', marginX, payY);
            payY += 25; 

            ctx.fillStyle = textDark;
            for (let i = 0; i < invoiceData.bankAccounts.length; i++) {
                const account = invoiceData.bankAccounts[i];
                if (i === 0) {
                    ctx.font = 'italic 15px Arial, sans-serif'; 
                } else {
                    ctx.font = 'bold 15px Arial, sans-serif'; 
                }
                ctx.fillText(account, marginX, payY);
                payY += 20; 
            }

            // 8. Footer Notes
            payY += 25; 
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(marginX - 10, payY - 20, contentWidth + 20, 85); 
            
            ctx.fillStyle = textMuted;
            ctx.font = '14px Arial, sans-serif'; 
            ctx.fillText('• Kirim bukti pembayaran setelah melakukan transfer.', marginX, payY);
            payY += 20; 
            ctx.fillText('• Pelunasan pembayaran dalam 24 jam setelah order.', marginX, payY);
            payY += 20; 
            ctx.fillText('• Metode Pengiriman: GoSend & JNE Yes.', marginX, payY);

            ctx.restore(); 
        }

        window.onload = function() {
            const savedData = localStorage.getItem('savedInvoiceData');
            if (savedData) {
                invoiceData = JSON.parse(savedData);
            }
            
            // Prioritaskan logo paten (Base64), jika kosong baru ambil dari LocalStorage
            const logoToLoad = defaultLogoBase64 ? defaultLogoBase64 : localStorage.getItem('savedInvoiceLogo');
            
            if (logoToLoad) {
                loadedLogoImg = new Image();
                loadedLogoImg.crossOrigin = 'anonymous';
                loadedLogoImg.onload = function() {
                    initUI();
                    drawInvoice();
                };
                loadedLogoImg.src = logoToLoad;
                return; 
            }

            initUI();     
            drawInvoice(); 
        };

        function saveData() {
            localStorage.setItem('savedInvoiceData', JSON.stringify(invoiceData));
            if (loadedLogoImg) {
                try {
                    localStorage.setItem('savedInvoiceLogo', loadedLogoImg.src);
                } catch (e) {
                    console.warn('Gagal menyimpan logo ke localStorage.');
                }
            } else {
                localStorage.removeItem('savedInvoiceLogo');
            }

            const btn = document.getElementById('saveBtn');
            const oldText = btn.innerText;
            btn.innerText = 'Tersimpan!';
            btn.classList.replace('bg-green-600', 'bg-blue-600');
            setTimeout(() => {
                btn.innerText = oldText;
                btn.classList.replace('bg-blue-600', 'bg-green-600');
            }, 2000);
        }

        function saveCanvasAsImage() {
            const dataUrl = canvas.toDataURL('image/png', 1.0); 
            const link = document.createElement('a');
            link.href = dataUrl;
            link.download = `Invoice_${invoiceData.invoiceNumber.replace(/[^a-zA-Z0-9_-]/g, '')}.png`;
            document.body.appendChild(link); 
            link.click();
            document.body.removeChild(link);
        }

        async function downloadPDF() {
            try {
                if (!window.jspdf) {
                    alert('PDF library gagal dimuat');
                    return;
                }

                const { jsPDF } = window.jspdf;

                const pdf = new jsPDF({
                    orientation: 'p',
                    unit: 'mm',
                    format: 'a4'
                });

                const imgData = canvas.toDataURL('image/png', 1.0);

                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = (canvas.height * pdfWidth) / canvas.width;

                pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);

                pdf.save(
                    `Invoice_${invoiceData.invoiceNumber.replace(/[^a-zA-Z0-9_-]/g, '')}.pdf`
                );

            } catch (error) {
                console.error(error);
                alert('Gagal generate PDF');
            }
        }

        function printInvoice() {
            const dataUrl = canvas.toDataURL('image/png', 1.0);
            let windowContent = '<!DOCTYPE html>';
            windowContent += '<html>';
            windowContent += '<head><title>Print Invoice - ' + invoiceData.invoiceNumber + '</title></head>';
            windowContent += '<body style="margin: 0; padding: 0; display: flex; justify-content: center;">';
            windowContent += '<img src="' + dataUrl + '" style="width: 100%; max-width: 210mm;" onload="window.print();" />';
            windowContent += '</body>';
            windowContent += '</html>';
            
            const printWin = window.open('', '_blank', 'width=800,height=900');
            printWin.document.open();
            printWin.document.write(windowContent);
            printWin.document.close();
        }

       

        function debounce(func, delay) {
            let timeout;

            return function () {
                clearTimeout(timeout);

                timeout = setTimeout(() => {
                    func();
                }, delay);
            };
        }

        setupCanvasResolution();

        window.addEventListener('resize', debounce(() => {
            setupCanvasResolution();
            drawInvoice();
        }, 300));

        window.addEventListener(
            'touchstart',
            () => {},
            { passive: true }
        );

    </script>
</body>
</html>
